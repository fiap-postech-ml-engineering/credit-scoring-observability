# Configuração de scrape do Prometheus.
#
# Um único alvo: a API. Ela expõe tanto as métricas ao vivo do serviço quanto
# as da última execução do pipeline batch — ver `DriftMetricsCollector` em
# src/observability/metrics.py para o porquê dessa escolha em vez de Pushgateway.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: credit-scoring-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: credit-scoring

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
